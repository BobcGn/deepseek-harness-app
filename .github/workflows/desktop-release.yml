name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package.
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: Package desktop release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: DeepSeek-Harness-macOS
          - name: Windows
            os: windows-latest
            artifact: DeepSeek-Harness-Windows

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop entries
        run: pnpm --filter @deepseek-ai/dsh-desktop run build

      - name: Package desktop artifacts
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist

      - name: Add unsigned macOS install note
        if: runner.os == 'macOS'
        run: |
          cat > apps/desktop/dist/INSTALL-macOS-unsigned.md <<'EOF'
          # Unsigned macOS Build

          These DeepSeek Harness macOS artifacts are unsigned. If macOS blocks the app after installation, remove Gatekeeper quarantine manually:

          ```sh
          xattr -r -d com.apple.quarantine /Applications/"DeepSeek Harness".app
          ```
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/INSTALL-macOS-unsigned.md
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Boot smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: package
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    env:
      DSH_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        # The packaged runtime deploys the whole @deepseek-ai/dsh dependency
        # graph, whose workspace packages must be built (bin.js ships from
        # apps/cli); mirror what the dist script builds.
        run: pnpm --workspace-root run build

      - name: Prepare runtime
        run: pnpm --filter @deepseek-ai/dsh-desktop run prepare-runtime

      - name: Boot the web profile on a fresh DSH_HOME
        shell: bash
        run: |
          export DSH_HOME="$(mktemp -d)"
          cd apps/desktop/runtime
          node --expose-internals lib/bin.js web --port 0 > boot.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if grep -q 'dsh web: http://127.0.0.1:' boot.log; then
              kill "$PID" 2>/dev/null || true
              echo "web profile booted successfully on ${{ matrix.name }}"
              exit 0
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          cat boot.log
          echo "web profile did not report a URL within 90s on ${{ matrix.name }}"
          exit 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package, smoke]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "DeepSeek Harness Desktop ${TAG_NAME#v}" --notes "Unsigned desktop preview build for small-scale distribution."
          gh release upload "$TAG_NAME" release-assets/* --clobber
